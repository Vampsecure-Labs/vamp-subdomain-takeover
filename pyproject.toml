[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-subdomain-takeover"
version = "1.3"
description = "Subdomain takeover vulnerability scanner — automatic CNAME fingerprint verification and --no-verify mode"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "subdomain", "takeover", "dns", "cloud"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
]


[project.scripts]
vamp-subdomain-takeover = "vamp_subdomain_takeover:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-subdomain-takeover"
Repository = "https://github.com/Vampsecure-Labs/vamp-subdomain-takeover"

[tool.setuptools]
py-modules = ["vamp_subdomain_takeover", "vampsec_report"]
